<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orixeo Learning Studio · SaaS Demo</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header><div><p class="eyebrow">ORIXEO LEARNING STUDIO</p><h1>Test SaaS</h1><p>Simulation locale : compte, entreprise, rôle, plan, quotas et isolation multi-tenant.</p></div><a href="./index.html"><button>Retour au Designer</button></a></header><section class="grid"><aside class="panel"><h2>Session de test</h2><label>Utilisateur<input id="userName" value="Manuel"></label><label>Entreprise<select id="tenant"><option value="orixeo">Orixeo Lab</option><option value="acme">Entreprise Démo B</option></select></label><label>Rôle<select id="role"><option value="owner">owner</option><option value="admin">admin</option><option value="trainer">trainer</option><option value="editor">editor</option><option value="viewer">viewer</option></select></label><label>Plan<select id="plan"><option value="starter">Starter</option><option value="pro">Pro</option><option value="business">Business</option></select></label><button id="runBtn" class="primary">Lancer le test</button><button id="crossTenantBtn" class="secondary">Tester accès autre entreprise</button></aside><section class="panel"><div class="panel-head"><h2>Résultat</h2><span id="status" class="badge">Prêt</span></div><div id="result" class="empty">Lance le test pour simuler le parcours SaaS.</div></section></section></main><script type="module" src="./demo-saas.js"></script></body></html>
